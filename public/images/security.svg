<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B49" />
      <stop offset="50%" stop-color="#0750C8" />
      <stop offset="100%" stop-color="#1464F4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#DCEBFF" />
      <stop offset="100%" stop-color="#8AC5FF" />
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0750C8" />
      <stop offset="100%" stop-color="#071B49" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#secBg)" />
  <circle cx="150" cy="120" r="160" fill="#55B8FF" opacity="0.12" />
  <circle cx="680" cy="400" r="180" fill="#DCEBFF" opacity="0.08" />

  <!-- Subtle Security Radar rings -->
  <circle cx="400" cy="270" r="180" fill="none" stroke="#55B8FF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="400" cy="270" r="230" fill="none" stroke="#55B8FF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Badge Text -->
  <rect x="250" y="30" width="300" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.3" />
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SECURITY &amp; GUARD SERVICES</text>

  <!-- Large Center Shield Graphic -->
  <g filter="url(#shadow)" transform="translate(400, 260)">
    <!-- Outer Shield -->
    <path d="M 0 -150 Q 110 -150 140 -80 Q 140 50 0 160 Q -140 50 -140 -80 Q -110 -150 0 -150 Z" 
          fill="url(#shieldGrad)" />
    <!-- Inner Dark Shield -->
    <path d="M 0 -135 Q 95 -135 120 -75 Q 120 40 0 140 Q -120 40 -120 -75 Q -95 -135 0 -135 Z" 
          fill="url(#innerShield)" />
    
    <!-- Golden / Sky Emblem Badge Star -->
    <polygon points="0,-85 16,-40 60,-40 25,-12 38,32 0,6 -38,32 -25,-12 -60,-40 -16,-40" 
             fill="#55B8FF" opacity="0.9" />

    <!-- Center Security Lock / Keyhole -->
    <g transform="translate(0, 15)">
      <circle cx="0" cy="0" r="30" fill="#FFFFFF" />
      <path d="M-10 -5 V-18 A 10 10 0 0 1 10 -18 V-5" fill="none" stroke="#071B49" stroke-width="5" stroke-linecap="round"/>
      <rect x="-16" y="-5" width="32" height="26" rx="5" fill="#1464F4"/>
      <circle cx="0" cy="6" r="3.5" fill="#FFFFFF"/>
      <polygon points="-2,6 2,6 1.5,13 -1.5,13" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Left Surveillance Camera Icon -->
  <g transform="translate(150, 280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="40" fill="#0750C8" />
    <!-- CCTV Camera -->
    <path d="M-16 -10 L12 -2 M12 6 L-16 -2 Z" fill="#FFFFFF" />
    <polygon points="-18,-15 12,-4 12,10 -18,1" fill="#FFFFFF" />
    <polygon points="12,-4 22,-10 22,16 12,10" fill="#55B8FF" />
    <line x1="-12" y1="1" x2="-12" y2="18" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="-20" y1="18" x2="-4" y2="18" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="18" cy="3" r="3" fill="#00E676" />
  </g>

  <!-- Right 24/7 Monitoring Badge -->
  <g transform="translate(650, 280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="40" fill="#1464F4" />
    <text x="0" y="-3" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">24/7</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DCEBFF" text-anchor="middle" letter-spacing="1">ACTIVE</text>
  </g>
</svg>

