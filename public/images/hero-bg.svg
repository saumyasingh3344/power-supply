<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051336" />
      <stop offset="40%" stop-color="#071B49" />
      <stop offset="75%" stop-color="#0750C8" />
      <stop offset="100%" stop-color="#1464F4" />
    </linearGradient>
    <radialGradient id="electricGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#55B8FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#1464F4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.04"/>
      <circle cx="80" cy="0" r="1.5" fill="#55B8FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="1920" height="1080" fill="url(#heroGradient)"/>
  <rect width="1920" height="1080" fill="url(#electricGlow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- High-tech circuit / power vectors -->
  <g stroke="#55B8FF" stroke-opacity="0.18" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 100 900 L 400 900 L 550 750 L 950 750 L 1100 600 L 1600 600"/>
    <path d="M 250 1000 L 450 800 L 800 800 L 950 650 L 1400 650 L 1550 500 L 1850 500"/>
    <path d="M 800 150 L 1050 150 L 1200 300 L 1500 300 L 1650 450 L 1920 450"/>
    <circle cx="550" cy="750" r="5" fill="#55B8FF" fill-opacity="0.5"/>
    <circle cx="1100" cy="600" r="5" fill="#55B8FF" fill-opacity="0.5"/>
    <circle cx="950" cy="650" r="5" fill="#55B8FF" fill-opacity="0.5"/>
    <circle cx="1200" cy="300" r="5" fill="#55B8FF" fill-opacity="0.5"/>
  </g>

  <!-- Giant power ring overlays -->
  <circle cx="1500" cy="400" r="350" stroke="#55B8FF" stroke-opacity="0.08" stroke-width="1.5" fill="none" stroke-dasharray="16 12"/>
  <circle cx="1500" cy="400" r="480" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" fill="none"/>
</svg>

